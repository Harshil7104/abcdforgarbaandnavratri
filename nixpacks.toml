# Nixpacks configuration for Railway deployment
# Find My Garba Partner (Monorepo: Express Backend + React Vite Client)

[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = [
  'npm install',
  'npm --prefix client install'
]

[phases.build]
cmds = [
  'npm --prefix client run build'
]

[start]
cmd = 'node server.js'
